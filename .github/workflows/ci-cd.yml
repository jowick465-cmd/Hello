name: CI/CD Vite Hello World

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: cicd-vite-hello
  IMAGE_TAG: ${{ github.sha }}
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  build-and-push:
    needs: [lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    outputs:
      image_uri: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker environment check
        run: |
          echo "--- Docker version ---"
          docker --version
          docker build --version 2>&1 || true
          docker buildx version 2>&1 || true
          echo "--- Disk space ---"
          df -h /var/lib/docker 2>/dev/null || df -h /
          echo "--- Docker info (truncated) ---"
          docker info 2>&1 | head -30

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true

      - name: Image summary
        run: |
          echo "✅ Pushed to GHCR:"
          echo "   ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}"
          echo "   ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:latest"

  deploy-self-hosted:
    needs: [build-and-push]
    runs-on: self-hosted
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop & remove old containers
        run: |
          docker stop ${{ env.IMAGE_NAME }} || true
          docker rm ${{ env.IMAGE_NAME }} || true
          docker stop container-manager || true
          docker rm container-manager || true

      - name: Pull from GHCR
        run: |
          docker pull ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:latest

      - name: Run app container
        run: |
          docker run -d \
            --name ${{ env.IMAGE_NAME }} \
            -p 3000:3000 \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:latest

      - name: Run container manager
        run: |
          docker run -d \
            --name container-manager \
            -p 3001:3001 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:latest \
            --target manager

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            APP_OK=false
            MGR_OK=false
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              APP_OK=true
              echo "✅ App container is healthy"
            fi
            if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              MGR_OK=true
              echo "✅ Manager container is healthy"
            fi
            if $APP_OK && $MGR_OK; then
              echo "Both containers healthy"
              exit 0
            fi
            echo "Waiting... ($i/10)"
            sleep 2
          done
          echo "❌ Container failed health check"
          echo "--- App logs ---"
          docker logs ${{ env.IMAGE_NAME }} 2>&1 | tail -20
          echo "--- Manager logs ---"
          docker logs container-manager 2>&1 | tail -20
          exit 1

      - name: Show running containers
        run: |
          docker ps --format "table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
          echo ""
          echo "Live at: http://localhost:3000"
          echo "Manager at: http://localhost:3001"
