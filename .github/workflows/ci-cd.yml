name: CI/CD Vite Hello World

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: cicd-vite-hello
  IMAGE_TAG: ${{ github.sha }}
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify Dockerfile exists
        run: ls -la Dockerfile && head -5 Dockerfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Image summary
        run: |
          echo "Pushed to GHCR"
          echo "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}"
          echo "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:latest"

  deploy-self-hosted:
    needs: [build]
    runs-on: self-hosted
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stop & remove old container
        run: |
          docker stop ${{ env.IMAGE_NAME }} || true
          docker rm ${{ env.IMAGE_NAME }} || true
      - name: Pull from GHCR
        run: |
          docker pull ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:latest
      - name: Run container
        run: |
          docker run -d \
            --name ${{ env.IMAGE_NAME }} \
            -p 3000:3000 \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:latest
      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "Container is healthy"
              exit 0
            fi
            echo "Waiting... ($i/10)"
            sleep 2
          done
          echo "Container failed health check"
          docker logs ${{ env.IMAGE_NAME }}
          exit 1
      - name: Show running container
        run: |
          docker ps --filter "name=${{ env.IMAGE_NAME }}" --format "table {{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
          echo "Live at: http://localhost:3000"
