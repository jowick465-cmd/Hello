name: CI/CD Vite Hello World

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: cicd-vite-hello
  IMAGE_TAG: ${{ github.sha }}
  # GHCR uses the repo owner/name as the image path
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      # For self-hosted deploy via SSH (if using SSH deploy method)
      # ssh: write   # uncomment if using SSH deploy
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      # ── Set up Docker Buildx ──────────────────────────────────
      - uses: docker/setup-buildx-action@v3

      # ── Log in to GHCR (GitHub Container Registry) ───────────
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build + push to GHCR ─────────────────────────────────
      - id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "Pushed to GHCR:"
          echo "  ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}"
          echo "  ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:latest"

  # ── DEPLOY: Self-hosted runner (runs on your machine) ────────
  #    This job runs on a runner labeled 'self-hosted' that you
  #    install on your local machine. It pulls from GHCR and runs
  #    the container locally.
  #
  #    Setup:
  #      1. Install self-hosted runner: github.com/<owner>/<repo>/settings/actions/runners
  #      2. Label it 'self-hosted' (default) or a custom label
  #      3. Ensure Docker is running on that machine
  #      4. The runner needs network access to GHCR (ghcr.io)
  deploy-self-hosted:
    needs: [build]
    runs-on: self-hosted
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop & remove old container
        run: |
          docker stop ${{ env.IMAGE_NAME }} || true
          docker rm ${{ env.IMAGE_NAME }} || true

      - name: Pull latest image from GHCR
        run: |
          docker pull ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:latest

      - name: Run container
        run: |
          docker run -d \
            --name ${{ env.IMAGE_NAME }} \
            -p 3000:3000 \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}:latest

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "✅ Container is healthy"
              exit 0
            fi
            echo "Waiting... ($i/10)"
            sleep 2
          done
          echo "❌ Container failed health check"
          docker logs ${{ env.IMAGE_NAME }}
          exit 1

      - name: Show running container
        run: |
          docker ps --filter "name=${{ env.IMAGE_NAME }}" --format "table {{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
          echo ""
          echo "Live at: http://localhost:3000"

  # ── DEPLOY: Alternative — SSH to a remote/local machine ─────
  #    Uncomment and configure if you prefer SSH deploy instead
  #    of a self-hosted runner. Requires SSH_PRIVATE_KEY secret.
  #
  # deploy-ssh:
