version: "3.9"

services:
  # ── Vite Hello World App ─────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cicd-vite-hello
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "app=cicd-vite-hello"

  # ── Container Manager Dashboard ──────────────────────────────
  manager:
    build:
      context: .
      dockerfile: Dockerfile
      target: manager
    container_name: container-manager
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PORT: "3001"
    restart: unless-stopped
    depends_on:
      - app
    labels:
      - "app=container-manager"

networks:
  default:
    name: cicd-network
